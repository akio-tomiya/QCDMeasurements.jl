name: CI

on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC (8 PM CST)
  push:
    branches: [main]
    tags: ["*"]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        version:
          - "1.11"
          - "1.12"
        os:
          - ubuntu-latest
          - macOS-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
        with:
          delete-old-caches: 'false'
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          annotate: true
      - uses: julia-actions/julia-processcoverage@v1

  mpi-test:
    name: Julia 1.11 - Linux - MPI (2 ranks)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.11"
      - uses: julia-actions/cache@v3
        with:
          delete-old-caches: 'false'
      - name: Run the test suite on two MPI ranks
        shell: bash
        run: >-
          julia --startup-file=no -e '
            using Pkg;
            Pkg.activate(; temp=true);
            Pkg.develop(Pkg.PackageSpec(path=pwd()));
            Pkg.add(["JACC", "MPI", "Random", "StaticArrays", "Test"]);
            project = dirname(Base.active_project());
            using MPI;
            run(`$(MPI.mpiexec()) -n 2 $(Base.julia_cmd())
              --startup-file=no --project=$project test/runtests.jl`);
          '

  latticematrices-compat:
    name: LatticeMatrices ${{ matrix.lattice_matrices }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        lattice_matrices:
          - "1.1.2"
          - "1.1.3"
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.11"
      - uses: julia-actions/cache@v3
        with:
          delete-old-caches: 'false'
      - name: Test the LatticeMatrices compatibility range
        env:
          LATTICE_MATRICES_VERSION: ${{ matrix.lattice_matrices }}
        run: >-
          julia --startup-file=no -e '
            using Pkg;
            Pkg.activate(; temp=true);
            Pkg.develop(Pkg.PackageSpec(path=pwd()));
            Pkg.add(Pkg.PackageSpec(
              name="LatticeMatrices",
              version=VersionNumber(ENV["LATTICE_MATRICES_VERSION"]),
            ));
            Pkg.test("QCDMeasurements"; coverage=false);
          '
